{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
        <title>{% block title %}{% endblock %}</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <link href="{% static 'encyclopedia/styles.css' %}" rel="stylesheet">
</head>
<body>
        <div class="row">
            <div class="sidebar col-lg-2 col-md-3 col-sm-3 col-4">
                <h2>Wiki</h2>
                {% block form %}
                {%endblock%}
                <div>
                    <a id="Home" href="{% url 'encyclopedia:index' %}">Home</a>
                </div>
                <div id="Create New Page">
                    Create New Page
                </div>
                <div id="Random Page">
                    Random Page
                </div>
                {% block nav %}
                {% endblock %}
            </div>
            
            <div class="main col-lg-10 col-md-9 col-sm-9 col-8">  
                {% block body %}
                {% endblock %}
                <h3 id="header">
                    {% block header%} 
                    {%endblock%}
                </h3>
            </div>
        </div>

</body>
<footer>
    <div></div>
</footer>
</html>
