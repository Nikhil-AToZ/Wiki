{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia
{% endblock %}

{% block form %}
    <form action="{% url 'encyclopedia:search' %}" method="post">
         {% csrf_token %}
         <input class="search" type="text" name="q" placeholder="Search Encyclopedia">
    </form>
{%endblock%}
{%block header%}
{{header}}
{%endblock%}

{% block body %}
    <h1>All Pages</h1>

    <ul>
        {% for entry in entries %}
        
            <li><a href="/{{ entry }}">{{ entry }}</a></li>
        {% endfor %}
    </ul>

{% endblock %}
