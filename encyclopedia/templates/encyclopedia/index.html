{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia
{% endblock %}



{% block body %}
    <h1>{{H1}}</h1>

    <ul>
        {% for entry in entries %}
            <li><a href="/{{entry}}">{{ entry|capfirst }}</a></li>
        {% endfor %}
    </ul>

    
   {%block header%}
   <h3>{{header}}</h3>
   
   {%endblock%}

{% endblock %}
